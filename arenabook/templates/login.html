<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - ArenaBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #1f2937; }
        .card { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #047857; text-align: center; margin-top: 0; font-size: 1.75rem; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 2rem; font-size: 0.95rem; }
        
        .alert { background-color: #fee2e2; color: #991b1b; padding: 0.75rem; border-radius: 8px; text-align: center; margin-bottom: 1.5rem; font-weight: 600; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #047857; box-shadow: 0 0 0 3px rgba(4,120,87,0.1); }
        
        .btn { width: 100%; padding: 0.875rem; background-color: #047857; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
        .btn:hover { background-color: #059669; }
        
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #047857; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to ArenaBook to manage your turfs</p>
        
        {% if error %}
            <div class="alert">{{ error }}</div>
        {% endif %}
        
        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn">Login</button>
        </form>
        
        <a href="{% url 'home' %}" class="back-link">Return to Homepage</a>
    </div>
</body>
</html>
